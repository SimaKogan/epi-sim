spring.application.name=episim
server.port=8080
# SSE must not be buffered or compressed
server.compression.enabled=false

# a browser closing the SSE connection is normal, do not log it as an error
logging.level.org.apache.catalina.core.ContainerBase.[Tomcat].[localhost].[/].[dispatcherServlet]=OFF
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseBodyEmitter=OFF
